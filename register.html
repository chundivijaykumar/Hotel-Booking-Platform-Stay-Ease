<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - StayEase</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172b4d;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: #12304d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .page {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            background: #eef4ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbe5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            text-align: center;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #15803d;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-text a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        @media(max-width:600px) {

            .navbar {
                height: auto;
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .register-card {
                padding: 30px 22px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">
        StayEase
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="hotels.html">
            Hotels
        </a>

        <a href="login.html">
            Login
        </a>

    </div>

</nav>



<div class="page">

    <div class="register-card">


        <div class="icon">
            👤
        </div>


        <h1>
            Create Your Account
        </h1>


        <p class="subtitle">
            Register to book your favourite hotels
        </p>


        <div
            id="message"
            class="message">
        </div>


        <form id="registerForm">


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Example: Ravi Kumar"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required>

            </div>


            <button type="submit">
                Register
            </button>


        </form>


        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>

</div>



<script>


/* =========================================
   GENERATE PERMANENT USER ID
   ========================================= */

function generateUserId() {

    let users =
        JSON.parse(
            localStorage.getItem("users")
        ) || [];


    let maxId = 50000;


    users.forEach(function(user) {

        if (user.id) {

            const id =
                Number(user.id);

            if (
                !isNaN(id) &&
                id >= 50000
            ) {

                if (id > maxId) {
                    maxId = id;
                }

            }

        }

    });


    return maxId + 1;
}



/* =========================================
   REGISTER
   ========================================= */

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const message =
            document
            .getElementById("message");


        /* ==============================
           VALIDATE MOBILE
           ============================== */

        if (!/^[0-9]{10}$/.test(phone)) {

            message.className =
                "message error";

            message.textContent =
                "Please enter a valid 10 digit mobile number.";

            return;
        }


        /* ==============================
           CHECK PASSWORD
           ============================== */

        if (password !== confirmPassword) {

            message.className =
                "message error";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        /* ==============================
           GET USERS
           ============================== */

        let users =
            JSON.parse(
                localStorage.getItem("users")
            ) || [];


        /* ==============================
           CHECK EMAIL
           ============================== */

        const existingUser =
            users.find(
                function(user) {

                    return (
                        user.email === email
                    );

                }
            );


        if (existingUser) {

            message.className =
                "message error";

            message.textContent =
                "This email is already registered.";

            return;
        }


        /* ==============================
           CREATE USER
           ============================== */

        const newUser = {

            id: generateUserId(),

            name: name,

            email: email,

            phone: phone,

            password: password

        };


        users.push(newUser);


        localStorage.setItem(
            "users",
            JSON.stringify(users)
        );


        /* ==============================
           SUCCESS
           ============================== */

        message.className =
            "message success";

        message.textContent =
            "Registration successful! Your User ID is " +
            newUser.id;


        document
        .getElementById("registerForm")
        .reset();


        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            1500
        );

    }
);

</script>


</body>

</html>
