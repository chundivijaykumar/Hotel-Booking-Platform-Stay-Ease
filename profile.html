<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - StayEase</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f5f7fb;

            color: #172b4d;

            min-height: 100vh;
        }


        /* =====================================
           NAVBAR
           ===================================== */

        .navbar {

            height: 72px;

            background: #12304d;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;
        }


        .logo {

            color: white;

            font-size: 28px;

            font-weight: bold;
        }


        .nav-links {

            display: flex;

            gap: 25px;
        }


        .nav-links a {

            color: white;

            text-decoration: none;
        }


        .nav-links a:hover {

            color: #60a5fa;
        }


        /* =====================================
           PROFILE
           ===================================== */

        .page {

            max-width: 800px;

            margin: auto;

            padding: 50px 20px;
        }


        .profile-card {

            background: white;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 6px 25px
                rgba(0,0,0,.08);

            text-align: center;
        }


        .profile-icon {

            width: 90px;

            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #eef4ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;
        }


        .profile-card h1 {

            font-size: 30px;

            margin-bottom: 8px;
        }


        .role {

            display: inline-block;

            background: #2563eb;

            color: white;

            padding: 6px 14px;

            border-radius: 20px;

            font-size: 13px;

            margin-bottom: 30px;
        }


        .profile-details {

            text-align: left;

            border-top: 1px solid #eee;

            padding-top: 25px;
        }


        .detail {

            background: #f5f7fb;

            padding: 16px;

            border-radius: 8px;

            margin-bottom: 12px;
        }


        .detail-label {

            display: block;

            color: #777;

            font-size: 13px;

            margin-bottom: 5px;
        }


        .detail-value {

            font-size: 16px;

            font-weight: bold;
        }


        /* =====================================
           BUTTONS
           ===================================== */

        .actions {

            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        .btn {

            padding: 13px 22px;

            border-radius: 8px;

            border: none;

            cursor: pointer;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }


        .btn-primary {

            background: #2563eb;

            color: white;
        }


        .btn-primary:hover {

            background: #1d4ed8;
        }


        .btn-danger {

            background: #dc2626;

            color: white;
        }


        .btn-danger:hover {

            background: #b91c1c;
        }


        .login-message {

            text-align: center;
        }


        .login-message h1 {

            margin-bottom: 12px;
        }


        .login-message p {

            color: #666;

            margin-bottom: 25px;
        }


        @media(max-width:600px) {

            .navbar {

                height: auto;

                padding: 15px 20px;

                flex-direction: column;

                gap: 15px;
            }


            .nav-links {

                gap: 12px;

                flex-wrap: wrap;

                justify-content: center;
            }


            .profile-card {

                padding: 30px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         NAVBAR
         ===================================== -->

    <nav class="navbar">


        <div class="logo">

            StayEase

        </div>


        <div class="nav-links">


            <a href="index.html">
                Home
            </a>


            <a href="hotels.html">
                Hotels
            </a>


            <a
                id="bookingLink"
                href="bookings.html">

                My Bookings

            </a>


        </div>


    </nav>



    <!-- =====================================
         PROFILE
         ===================================== -->

    <main class="page">


        <div
            id="profileContainer"
            class="profile-card">

        </div>


    </main>



    <script>


        const container =
            document.getElementById(
                "profileContainer"
            );


        const currentUser =
            JSON.parse(
                localStorage.getItem(
                    "currentUser"
                )
            );


        const adminLoggedIn =
            localStorage.getItem(
                "adminLoggedIn"
            ) === "true";


        /* =====================================
           ADMIN PROFILE
           ===================================== */

        if (adminLoggedIn) {


            document.getElementById(
                "bookingLink"
            ).style.display = "none";


            container.innerHTML = `

                <div class="profile-icon">
                    🛡️
                </div>


                <h1>
                    StayEase Admin
                </h1>


                <span class="role">
                    Administrator
                </span>


                <div class="profile-details">


                    <div class="detail">

                        <span class="detail-label">
                            Name
                        </span>

                        <span class="detail-value">
                            StayEase Administrator
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Email
                        </span>

                        <span class="detail-value">
                            admin@stayease.in
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Role
                        </span>

                        <span class="detail-value">
                            Hotel Platform Administrator
                        </span>

                    </div>


                </div>


                <div class="actions">


                    <a
                        href="admin/dashboard.html"
                        class="btn btn-primary">

                        Admin Dashboard

                    </a>


                    <button
                        class="btn btn-danger"
                        onclick="logoutAdmin()">

                        Logout

                    </button>


                </div>

            `;

        }


        /* =====================================
           USER PROFILE
           ===================================== */

        else if (currentUser) {


            container.innerHTML = `

                <div class="profile-icon">
                    👤
                </div>


                <h1>
                    ${currentUser.name}
                </h1>


                <span class="role">
                    User
                </span>


                <div class="profile-details">


                    <div class="detail">

                        <span class="detail-label">
                            Full Name
                        </span>

                        <span class="detail-value">
                            ${currentUser.name}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Email Address
                        </span>

                        <span class="detail-value">
                            ${currentUser.email}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            Mobile Number
                        </span>

                        <span class="detail-value">
                            ${currentUser.phone || "Not provided"}
                        </span>

                    </div>


                </div>


                <div class="actions">


                    <a
                        href="bookings.html"
                        class="btn btn-primary">

                        My Bookings

                    </a>


                    <button
                        class="btn btn-danger"
                        onclick="logoutUser()">

                        Logout

                    </button>


                </div>

            `;

        }


        /* =====================================
           NOT LOGGED IN
           ===================================== */

        else {


            document.getElementById(
                "bookingLink"
            ).style.display = "none";


            container.innerHTML = `

                <div class="login-message">


                    <div class="profile-icon">
                        🔐
                    </div>


                    <h1>
                        Login Required
                    </h1>


                    <p>
                        Please login to view your profile.
                    </p>


                    <div class="actions">


                        <a
                            href="login.html"
                            class="btn btn-primary">

                            Login

                        </a>


                        <a
                            href="register.html"
                            class="btn btn-primary">

                            Register

                        </a>


                    </div>


                </div>

            `;

        }


        /* =====================================
           USER LOGOUT
           ===================================== */

        function logoutUser() {


            localStorage.removeItem(
                "currentUser"
            );


            window.location.href =
                "index.html";

        }


        /* =====================================
           ADMIN LOGOUT
           ===================================== */

        function logoutAdmin() {


            localStorage.removeItem(
                "adminLoggedIn"
            );


            window.location.href =
                "index.html";

        }

    </script>


</body>

</html>
